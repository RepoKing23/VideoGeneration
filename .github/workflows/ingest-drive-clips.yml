# Ingest link-shared Google Drive media into a temporary data branch.
#
# The remote build container cannot reach Drive's download hosts, so this
# workflow does the fetch on a runner and hands the bytes over via git,
# which the container can always reach. The data branch is meant to be
# deleted once the session has fetched it - it is transport, not history.
#
# Runs on pushes that touch .github/drive-ingest.txt (fileId:filename pairs,
# one per line, '#' comments allowed). workflow_dispatch also works once the
# workflow exists on the default branch.
name: ingest-drive-clips

on:
  push:
    paths:
      - ".github/drive-ingest.txt"
  workflow_dispatch:
    inputs:
      files:
        description: "Whitespace-separated fileId:filename pairs (overrides the manifest)"
        required: false
        type: string
      branch:
        description: "Data branch to force-push the media to"
        required: false
        default: "claude/clinic-clips-data"
        type: string

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download from Drive
        run: |
          set -euo pipefail
          pip install --quiet gdown
          files="${{ inputs.files || '' }}"
          if [ -z "$files" ]; then
            files=$(grep -v '^#' .github/drive-ingest.txt | tr '\n' ' ')
          fi
          mkdir -p /tmp/ingest
          for pair in $files; do
            id="${pair%%:*}"; name="${pair##*:}"
            echo "fetching $name ($id)"
            gdown --fuzzy "https://drive.google.com/uc?id=${id}" -O "/tmp/ingest/${name}"
          done
          ls -l /tmp/ingest
      - name: Push data branch
        run: |
          set -euo pipefail
          branch="${{ inputs.branch || 'claude/clinic-clips-data' }}"
          cd /tmp/ingest
          git init -b "$branch"
          git config user.email "actions@github.com"
          git config user.name "ingest-drive-clips"
          git add -A
          git commit -m "Ingest Drive media (temporary transport branch)"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin "$branch"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
